name: Build Windows Release

on:
  push:
    tags:
      - 'v*'  # Trigger bei Version-Tags (v3.0.2, etc.)
  workflow_dispatch:  # Manueller Trigger

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v7
    
    - name: Setup Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.12'
        cache: 'pip'
    
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller pillow pywinpty
        pip install PyQt6 PyQt6-WebEngine httpx websockets keyring cryptography pyte
    
    - name: Extract Version
      id: version
      shell: bash
      run: |
        VERSION=$(grep -E "^VERSION" ailinux_client/version.py | cut -d'"' -f2)
        echo "version=$VERSION" >> $GITHUB_OUTPUT
    
    - name: Generate Windows icon
      run: |
        python -c "from PIL import Image; img=Image.open('icon.jpg'); img.save('icon.ico', format='ICO', sizes=[(256,256),(128,128),(64,64),(48,48),(32,32),(16,16)])"

    - name: Build Windows Executable
      run: |
        pyinstaller `
          --name="AILinux-Client" `
          --onefile `
          --windowed `
          --icon="icon.ico" `
          --add-data="ailinux_client/ui;ailinux_client/ui" `
          --add-data="ailinux_client/translations;ailinux_client/translations" `
          --add-data="ailinux_client/assets;ailinux_client/assets" `
          --add-data="icon.jpg;." `
          --hidden-import=PyQt6 `
          --hidden-import=PyQt6.QtWidgets `
          --hidden-import=PyQt6.QtCore `
          --hidden-import=PyQt6.QtGui `
          --hidden-import=PyQt6.QtWebEngineWidgets `
          --hidden-import=httpx `
          --hidden-import=websockets `
          --hidden-import=keyring `
          --hidden-import=cryptography `
          --hidden-import=PIL `
          --hidden-import=winpty `
          --clean `
          --noconfirm `
          ailinux_client/main.py
    
    - name: Create Installer (Optional - Inno Setup)
      run: |
        # Für später: Inno Setup Installer erstellen
        echo "Standalone .exe erstellt"
    
    - name: Upload Artifact
      uses: actions/upload-artifact@v7
      with:
        name: AILinux-Client-Windows-${{ steps.version.outputs.version }}
        path: dist/AILinux-Client.exe
        if-no-files-found: error
    
  # Optional: Linux Build parallel
  build-linux:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v7
    
    - name: Setup Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.12'
    
    - name: Build Linux
      run: |
        pip install pyinstaller pillow PyQt6 PyQt6-WebEngine httpx websockets keyring cryptography pyte
        pyinstaller --onefile --name=ailinux-client ailinux_client/main.py
    
    - name: Upload Linux Artifact
      uses: actions/upload-artifact@v7
      with:
        name: AILinux-Client-Linux
        path: dist/ailinux-client
        if-no-files-found: error

  publish-verified-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: AILinux-Client-Windows-${{ needs.build-windows.outputs.version }}
          path: verified/windows
      - uses: actions/download-artifact@v8
        with:
          name: AILinux-Client-Linux
          path: verified/linux
      - name: Verify version and binaries
        shell: bash
        run: |
          set -euo pipefail
          expected="${GITHUB_REF_NAME#v}"
          actual=$(python3 -c 'from ailinux_client.version import VERSION; print(VERSION)')
          test "$expected" = "$actual"
          test "${{ needs.build-windows.outputs.version }}" = "$expected"
          test -s verified/windows/AILinux-Client.exe
          test -s verified/linux/ailinux-client
          python3 - <<'VERIFY'
          from pathlib import Path
          exe=Path('verified/windows/AILinux-Client.exe')
          elf=Path('verified/linux/ailinux-client')
          assert exe.open('rb').read(2)==b'MZ', 'Windows EXE header invalid'
          assert elf.open('rb').read(4)==b'\x7fELF', 'Linux ELF header invalid'
          print('RELEASE_BINARIES_VALIDATED')
          VERIFY
          mkdir -p release
          cp verified/windows/AILinux-Client.exe "release/AILinux-Client-${expected}-windows-x86_64.exe"
          cp verified/linux/ailinux-client "release/ailinux-client-${expected}-linux-x86_64"
          (cd release && sha256sum * > SHA256SUMS.txt)
      - name: Publish after successful platform builds
        uses: softprops/action-gh-release@v3
        with:
          name: AILinux Client ${{ needs.build-windows.outputs.version }}
          prerelease: true
          files: release/*
          fail_on_unmatched_files: true
          generate_release_notes: true
